services:
  postgres:
    image: postgres:16
    container_name: sqlagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sqlagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sqlagent}
      POSTGRES_DB: ${POSTGRES_DB:-sqlagent}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./data/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sqlagent} -d ${POSTGRES_DB:-sqlagent}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
