name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sqlagent
          POSTGRES_PASSWORD: sqlagent
          POSTGRES_DB: sqlagent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sqlagent -d sqlagent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sqlagent:sqlagent@127.0.0.1:5432/sqlagent
      STATEMENT_TIMEOUT_MS: "5000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply schema and seed, then run tests on PostgreSQL
        run: |
          python -c "from src.db import init_database; init_database()"
          pytest -q
